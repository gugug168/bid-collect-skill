name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check scripts/province-collect.cjs
      - name: Offline regression suite
        run: node scripts/self-test.cjs
